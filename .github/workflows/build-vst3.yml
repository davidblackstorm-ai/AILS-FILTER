name: Build AILS Filter VST3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AILS Filter
        shell: powershell
        run: |
          cmake -S AILS_Filter_HP `
                -B AILS_Filter_HP/build `
                -G "Visual Studio 17 2022" `
                -A x64

      - name: Build AILS Filter VST3
        shell: powershell
        run: |
          cmake --build AILS_Filter_HP/build `
                --config Release `
                --target AILS_Filter_HP_VST3 `
                --parallel 2

      - name: Locate VST3
        shell: powershell
        run: |
          Write-Host "Searching for VST3..."
          Get-ChildItem `
            -Path "AILS_Filter_HP/build" `
            -Recurse `
            -Directory `
            -Filter "*.vst3" |
          Select-Object FullName

      - name: Upload AILS Filter VST3
        uses: actions/upload-artifact@v4
        with:
          name: AILS-Filter-HP-VST3-Windows
          path: AILS_Filter_HP/build/AILS_Filter_HP_artefacts/Release/VST3/
          if-no-files-found: error
